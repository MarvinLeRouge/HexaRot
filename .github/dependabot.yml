version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not supported by typescript-eslint yet: lift once it is.
      - dependency-name: "typescript"
        versions: [">= 7"]
      # Node types follow the Node runtime major (node:24 images, CI node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not supported by typescript-eslint yet: lift once it is.
      - dependency-name: "typescript"
        versions: [">= 7"]
      # Node types follow the Node runtime major (node:24 images, CI node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
