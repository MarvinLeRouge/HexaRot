name: Build & Deploy

on:
  # Triggered after CI passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger for hotfixes (bypasses the CI gate)
  workflow_dispatch:

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      packages: write

    steps:
      # ── Resolve the exact commit SHA and lowercase repo name ────────────────
      - name: Resolve SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}

      # ── Authenticate with GHCR ───────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build and push images ────────────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: backend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:latest
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:${{ steps.sha.outputs.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: production
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:latest
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:${{ steps.sha.outputs.sha }}

      # ── Deploy to VPS ────────────────────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ steps.sha.outputs.sha }}
          REPO: ${{ steps.sha.outputs.repo }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: GHCR_TOKEN,ACTOR,SHA,REPO
          script: |
            set -Eeuo pipefail

            echo "==> Ensure deploy directories exist"
            mkdir -p /home/mlr/marvinlerouge.dev/hexarot/compose
            mkdir -p /home/mlr/marvinlerouge.dev/hexarot/shared/env

            echo "==> Fetch docker-compose.prod.yml (commit: ${SHA})"
            curl -fsSL \
              "https://raw.githubusercontent.com/${REPO}/${SHA}/docker-compose.prod.yml" \
              -o /home/mlr/marvinlerouge.dev/hexarot/compose/docker-compose.prod.yml

            cd /home/mlr/marvinlerouge.dev/hexarot/compose

            # pin the images pushed above for this commit, instead of the compose default (latest)
            export IMAGE_TAG="${SHA}"

            echo "==> Authenticate with GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            echo "==> Pull new images"
            docker compose -f docker-compose.prod.yml pull

            echo "==> Start database"
            docker compose -f docker-compose.prod.yml up -d postgres

            echo "==> Wait for database to be healthy"
            timeout 60 sh -c 'until docker compose -f docker-compose.prod.yml exec -T postgres sh -c "pg_isready -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\""; do sleep 2; done'

            echo "==> Run pending migrations"
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              npx prisma migrate deploy

            echo "==> Seed reference data and admin account"
            # seed.ts idempotently upserts the alphabet data and the single admin
            # account (update: {} on conflict) - safe to run on every deploy, never
            # overwrites an existing account's password, role, or status.
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              npx prisma db seed

            echo "==> Start all services"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Wait for backend to be healthy"
            timeout 90 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hexarot-backend)" = healthy ]; do sleep 3; done' \
              || { docker compose -f docker-compose.prod.yml logs --tail 50 backend; exit 1; }

            echo "==> Stack status"
            docker compose -f docker-compose.prod.yml ps
