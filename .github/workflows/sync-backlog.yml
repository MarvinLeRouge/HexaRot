name: Sync backlog — BACKLOG.md to GitHub Issues and Kanban

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'BACKLOG.md'
  workflow_dispatch:

jobs:
  sync:
    name: Sync BACKLOG.md
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HEXAROT_PROJECT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install @octokit/rest @octokit/graphql
        working-directory: .github/scripts

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.HEXAROT_PROJECT_TOKEN }}
          GITHUB_OWNER: MarvinLeRouge
          GITHUB_REPO: HexaRot
          PROJECT_ID: PVT_kwHOAA1qPc4BSIDU
        run: node sync-backlog.js
        working-directory: .github/scripts
