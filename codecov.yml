flag_management:
  default_rules:
    ignore:
      # Backend — entry point, seed data, generated Prisma client, DI wiring
      - "backend/src/main.ts"
      - "backend/prisma/seed.ts"
      - "backend/prisma/migrations/**"
      - "backend/generated/**"
      - "backend/src/**/*.module.ts"
      - "backend/src/**/__fixtures__/**"
      # Frontend — entry point and framework wiring
      - "frontend/src/main.ts"
      - "frontend/src/App.vue"
      - "frontend/src/router/**"
      - "frontend/src/layouts/**"
      - "frontend/src/__fixtures__/**"

flags:
  backend:
    paths:
      - backend/src/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

coverage:
  status:
    # informational until the first real merged number is observed on a PR;
    # flip to false once confirmed the true combined total clears 85% (see TEST-005)
    project:
      default:
        enabled: true
        target: 85%
        threshold: 2%
        informational: true
    patch:
      default:
        enabled: true
        target: 70%
        threshold: 5%
        informational: false

comment:
  layout: reach,diff,flags,files
  behavior: default
  require_changes: true
