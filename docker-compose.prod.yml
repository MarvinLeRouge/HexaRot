name: hexarot

services:
  postgres:
    image: postgres:16-alpine
    container_name: hexarot-postgres
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from secrets.env
    env_file:
      - ../shared/env/app.env
      - ../shared/env/secrets.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, which has the env_file values
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  backend:
    image: ghcr.io/marvinlerouge/hexarot/backend:${IMAGE_TAG:-latest}
    container_name: hexarot-backend
    expose:
      - "3000"
    env_file:
      - ../shared/env/app.env
      - ../shared/env/secrets.env
    depends_on:
      postgres:
        condition: service_healthy
    # Traefik only routes to the container once this probe passes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      # probe often while starting, or the API stays unrouted for a full interval
      start_interval: 3s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hexarot-api.rule=Host(`hexarot.marvinlerouge.dev`) && PathPrefix(`/api`)"
      - "traefik.http.routers.hexarot-api.entrypoints=websecure"
      - "traefik.http.routers.hexarot-api.tls=true"
      - "traefik.http.routers.hexarot-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hexarot-api.service=hexarot-backend"
      - "traefik.http.services.hexarot-backend.loadbalancer.server.port=3000"
    networks:
      - traefik-public
      - internal

  frontend:
    image: ghcr.io/marvinlerouge/hexarot/frontend:${IMAGE_TAG:-latest}
    container_name: hexarot-frontend
    expose:
      - "80"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hexarot-frontend.rule=Host(`hexarot.marvinlerouge.dev`)"
      - "traefik.http.routers.hexarot-frontend.entrypoints=websecure"
      - "traefik.http.routers.hexarot-frontend.tls=true"
      - "traefik.http.routers.hexarot-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.hexarot-frontend.loadbalancer.server.port=80"
    networks:
      - traefik-public

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
